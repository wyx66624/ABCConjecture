name: ABC correlated completions and manuscript verification
on:
  push:
    branches: ['verify/correlated-completions-20260906*']
    paths: ['.staging/correlated-20260906/**', 'research/checkpoints/2026_09_06_correlated_completions/**', '.github/workflows/abc-correlated-completions.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Require sealed transport and extract only allowed new sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64,hashlib,tarfile,io,json
          src=Path('.staging/correlated-20260906')
          D=Path('research/checkpoints/2026_09_06_correlated_completions')
          if not src.exists():
              assert (D/'verification/source_manifest.json').is_file()
              print('Source transport already integrated; using sealed source manifest.')
              raise SystemExit(0)
          pieces=[base64.b64encode((src/'part0.bin').read_bytes()).decode()]
          pieces += [(src/f'part{i}.txt').read_text() for i in range(1,7)]
          assert hashlib.sha256(pieces[0].encode()).hexdigest()=='ae0f5a742429aabdea427f702ad9cea5260c2936a3ed73defcf20ae7afa29c04'
          for a,b,s in reversed([[1961,1963,'Z'],[2201,2203,'zM0'],[2715,2716,'/']]):
              pieces[0]=pieces[0][:a]+s+pieces[0][b:]
          raw=base64.b64decode(''.join(pieces),validate=True)
          expected='d71c1065186e150e2b33a9109dfc25caf924ace88bc08cc60a772f0b59263ff4'
          assert len(raw)==39270 and hashlib.sha256(raw).hexdigest()==expected
          archive=tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz')
          members=archive.getmembers()
          assert len(members)==15
          payload=[]
          for info in members:
              name=PurePosixPath(info.name)
              assert info.isfile() and not name.is_absolute() and '..' not in name.parts
              assert str(name).startswith(str(D)+'/') or str(name)=='paper/supplements/checkpoint_compression_20260906.tex'
              content=archive.extractfile(info).read()
              dest=Path(str(name))
              if dest.exists(): assert dest.is_file() and dest.read_bytes()==content, str(dest)
              payload.append((dest,content))
          for dest,content in payload:
              dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(content)
          (D/'verification/transport_integrity.json').write_text(json.dumps({'archive_sha256':expected,'archive_bytes':39270,'files':15,'status':'exact original source archive recovered before extraction','transport_run_previously_failed':34019814889},indent=2)+'\n')
          print('PASS: exact archive identity and safe allowlisted extraction.')
          PY
      - name: Check exact replay, source preservation and actual Lean proofs
        shell: bash
        run: |
          set -euo pipefail
          D=research/checkpoints/2026_09_06_correlated_completions
          python3 "$D/verify.py"
          python3 "$D/integrate.py"
          sha256sum paper/ChatGPT_ABC_Uniformity_2026.tex > /tmp/master-before.sha256
          python3 "$D/integrate.py"
          sha256sum -c /tmp/master-before.sha256
          bash "$D/wsl/verify_lean.sh"
      - name: Install manuscript tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-extra texlive-fonts-recommended cm-super
          python3 -m pip install --quiet pypdf
      - name: Compile both manuscripts and record actual scope
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          D=research/checkpoints/2026_09_06_correlated_completions
          (cd "$D/paper" && latexmk -pdf -interaction=nonstopmode -halt-on-error ChatGPT_ABC_Correlated_Completions_2026.tex)
          (cd paper && latexmk -pdf -interaction=nonstopmode -halt-on-error ChatGPT_ABC_Uniformity_2026.tex)
          cp paper/ChatGPT_ABC_Uniformity_2026.pdf output/pdf/ChatGPT_ABC_Uniformity_2026.pdf
          python3 "$D/record_build.py"
          python3 "$D/verify.py"
      - name: Commit only reviewed generated paths to the working branch
        if: startsWith(github.ref_name, 'verify/correlated-completions-20260906')
        shell: bash
        run: |
          set -euo pipefail
          D=research/checkpoints/2026_09_06_correlated_completions
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          D=Path('research/checkpoints/2026_09_06_correlated_completions')
          paths=list(json.loads((D/'verification/source_manifest.json').read_text()))
          paths += [str(D/'verification/source_manifest.json'),str(D/'verification/build_validation.json'),str(D/'verification/transport_integrity.json'),str(D/'verification/runtime/compiler.txt'),str(D/'verification/runtime/source.sha256'),str(D/'verification/runtime/axioms.log'),str(D/'paper/ChatGPT_ABC_Correlated_Completions_2026.pdf'),'paper/ChatGPT_ABC_Uniformity_2026.tex','paper/supplements/checkpoint_correlated_completions_20260906.tex','output/pdf/ChatGPT_ABC_Uniformity_2026.pdf']
          for path in paths:
              if Path(path).is_file():subprocess.run(['git','add','-f','--',path],check=True)
          stage=Path('.staging/correlated-20260906')
          if stage.exists():subprocess.run(['git','rm','-r','--',str(stage)],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate byte-checked completion and ramification research with the rebuilt ABC manuscript; retain global gap'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Export independently reviewable sources, outputs and logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: correlated-completions-integrated-review
          path: |
            paper/**/*.tex
            paper/ChatGPT_ABC_Uniformity_2026.log
            output/pdf/ChatGPT_ABC_Uniformity_2026.pdf
            research/checkpoints/2026_09_06_correlated_completions/**
            .github/workflows/abc-correlated-completions.yml
          include-hidden-files: true
          retention-days: 7
