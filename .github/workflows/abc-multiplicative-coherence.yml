name: Actual multiplicative coherence verification

on:
  push:
    branches: [main]
    paths:
      - 'research/checkpoints/2026_09_07_multiplicative_coherence/**'
      - 'research/checkpoints/2026_09_07_critical_bottleneck/twelfth_round/**'
      - 'research/checkpoints/2026_09_07_adversarial_audit/twelfth_round/**'
      - 'research/checkpoints/2026_09_07_independent_route/twelfth_round/**'
      - 'research/checkpoints/2026_09_05_eisenstein_descent/Lean/EisensteinDescent.lean'
      - 'Lean/lean-toolchain'
      - '.github/workflows/abc-multiplicative-coherence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-phase-and-finite-count:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install the pinned compiler
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: 'false'
          build: 'false'
          use-mathlib-cache: 'false'
      - name: Prepare a Mathlib-only dependency project
        run: python3 research/checkpoints/2026_09_07_multiplicative_coherence/prepare_mathlib_project.py
      - name: Resolve exact Mathlib and restore required imports
        working-directory: tmp/abc_20260907/multiplicative-coherence-ci-project
        run: |
          lake update
          lake exe cache get Mathlib.Tactic Mathlib.NumberTheory.Divisors Mathlib.Algebra.BigOperators.Group.Finset.Basic Mathlib.Analysis.Real.Sqrt Mathlib.Data.Finset.Lattice.Fold
      - name: Fresh 21 new declarations and 29 dependency declarations with complete axiom audit
        run: python3 research/checkpoints/2026_09_07_multiplicative_coherence/verify_mathlib.py --project tmp/abc_20260907/multiplicative-coherence-ci-project
      - name: Exact phase, private-support and curve replays
        run: python3 research/checkpoints/2026_09_07_multiplicative_coherence/verify_finite.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actual-multiplicative-coherence-evidence
          path: |
            research/checkpoints/2026_09_07_multiplicative_coherence/verification/mathlib_validation.json
            research/checkpoints/2026_09_07_multiplicative_coherence/verification/fresh-mathlib-build.log
            research/checkpoints/2026_09_07_multiplicative_coherence/verification/finite_replay_validation.json
