name: Lean v27 targeted diagnostic

on:
  push:
    branches:
      - "formalize/coprime-residue-product-core-v27"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Resolve pinned dependencies and restore Mathlib cache
        working-directory: Lean
        run: |
          lake update >/dev/null 2>&1
          lake exe cache get >/dev/null 2>&1

      - name: Compile v27 target
        working-directory: Lean
        run: lake build IUTThreeClosures.CoprimeModuliResidualProductCore
