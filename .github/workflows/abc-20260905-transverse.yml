name: Transverse arithmetic benchmark Lean check
on:
  push:
    branches: ["verify/**", "main"]
    paths:
      - "research/checkpoints/2026_09_05_transverse_lifting/**"
      - ".github/workflows/abc-20260905-transverse.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transverse-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check source hashes and exact finite replay
        shell: bash
        run: |
          set -euo pipefail
          python3 research/checkpoints/2026_09_05_transverse_lifting/verify.py
      - name: Run the isolated WSL-compatible Lean verifier
        shell: bash
        run: |
          set -euo pipefail
          bash research/checkpoints/2026_09_05_transverse_lifting/wsl/verify_lean.sh
