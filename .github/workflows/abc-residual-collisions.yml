name: Residual collisions scoped verification

on:
  push:
    branches: [main]
    paths:
      - 'research/checkpoints/2026_09_07_residual_collisions/**'
      - 'research/checkpoints/2026_09_07_adversarial_audit/third_round/**'
      - 'research/checkpoints/2026_09_07_critical_bottleneck/third_round/**'
      - 'research/checkpoints/2026_09_07_independent_route/third_round/**'
      - 'research/checkpoints/2026_09_05_eisenstein_descent/Lean/**'
      - 'research/checkpoints/2026_09_06_moving_support/Lean/**'
      - 'Lean/lean-toolchain'
      - '.github/workflows/abc-residual-collisions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-cancellation-and-determinants:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install the repository-pinned compiler
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: 'false'
          build: 'false'
          use-mathlib-cache: 'false'
      - name: Fresh scoped Lean build and complete theorem axiom audit
        run: python3 research/checkpoints/2026_09_07_residual_collisions/verify_round.py
      - name: Independently replay actual collision and finite-ring arithmetic
        run: |
          python3 research/checkpoints/2026_09_07_adversarial_audit/third_round/verify_collision.py
          python3 research/checkpoints/2026_09_07_critical_bottleneck/third_round/replay.py
          python3 research/checkpoints/2026_09_07_independent_route/third_round/exact_geometry_replay.py
          git diff --exit-code -- research/checkpoints/2026_09_07_adversarial_audit/third_round/verification/collision_results.json research/checkpoints/2026_09_07_critical_bottleneck/third_round/finite_replay.json research/checkpoints/2026_09_07_independent_route/third_round/exact_geometry_results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: residual-collision-proof-evidence
          path: |
            research/checkpoints/2026_09_07_residual_collisions/verification/
            research/checkpoints/2026_09_07_adversarial_audit/third_round/verification/
            research/checkpoints/2026_09_07_critical_bottleneck/third_round/finite_replay.json
            research/checkpoints/2026_09_07_independent_route/third_round/exact_geometry_results.json
