        shell: bash
        run: |
          set -euo pipefail
          current=$(gh pr view 375 --repo wyx66624/ABCConjecture --json headRefOid --jq .headRefOid)
          test "$current" = "$PINNED_SHA"
          gh pr merge 375 --repo wyx66624/ABCConjecture --merge \
            --match-head-commit "$PINNED_SHA" \
            --subject "Merge exponent-surplus dichotomies and deterministic selectors" \
            --body "Merged only after a full Lean kernel build, unfinished-proof scan, olean verification, and an exact head-SHA recheck."
