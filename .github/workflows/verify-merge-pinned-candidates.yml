      - uses: actions/checkout@v5
        if: steps.pin.outputs.already_merged != 'true'
        with:
          ref: ${{ steps.pin.outputs.sha }}
          fetch-depth: 0

      - name: Install Lean
        if: steps.pin.outputs.already_merged != 'true'
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
