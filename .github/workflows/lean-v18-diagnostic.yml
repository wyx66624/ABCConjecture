name: Lean v18 diagnostic

on:
  push:
    branches:
      - "formalize/endpoint-radical-excess-budget-v18"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Resolve pinned dependencies and restore Mathlib cache
        working-directory: Lean
        shell: bash
        run: |
          lake update >/dev/null 2>&1
          lake exe cache get >/dev/null 2>&1

      - name: Compile target and preserve diagnostics
        working-directory: Lean
        shell: bash
        run: |
          set +e
          lake build IUTThreeClosures.EndpointRadicalExcessBudget > ../v18-diagnostic.log 2>&1
          echo "$?" > ../v18-diagnostic.exit
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: v18-lean-diagnostic
          path: |
            v18-diagnostic.log
            v18-diagnostic.exit
          if-no-files-found: error
