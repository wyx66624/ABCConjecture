name: Support and power classes scoped verification

on:
  push:
    branches: [main]
    paths:
      - 'research/checkpoints/2026_09_07_support_power_classes/**'
      - 'research/checkpoints/2026_09_07_adversarial_audit/fourth_round/**'
      - 'research/checkpoints/2026_09_07_critical_bottleneck/fourth_round/**'
      - 'research/checkpoints/2026_09_07_independent_route/fourth_round/**'
      - 'research/checkpoints/2026_09_05_eisenstein_descent/Lean/EisensteinDescent.lean'
      - 'Lean/lean-toolchain'
      - '.github/workflows/abc-support-power-classes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-seeds-and-denominator-arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install the repository-pinned compiler
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: 'false'
          build: 'false'
          use-mathlib-cache: 'false'
      - name: Fresh scoped Lean build and complete theorem axiom audit
        run: python3 research/checkpoints/2026_09_07_support_power_classes/verify_round.py
      - name: Independently replay signed depth, power lifting and actual extractions
        run: |
          python3 research/checkpoints/2026_09_07_critical_bottleneck/fourth_round/replay.py --check
          python3 research/checkpoints/2026_09_07_independent_route/fourth_round/exact_power_lifting.py
          python3 research/checkpoints/2026_09_07_adversarial_audit/fourth_round/replay.py
          git diff --exit-code -- research/checkpoints/2026_09_07_independent_route/fourth_round/exact_power_lifting_results.json research/checkpoints/2026_09_07_adversarial_audit/fourth_round/verification/results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: support-power-class-proof-evidence
          path: |
            research/checkpoints/2026_09_07_support_power_classes/verification/
            research/checkpoints/2026_09_07_critical_bottleneck/fourth_round/finite_replay.json
            research/checkpoints/2026_09_07_independent_route/fourth_round/exact_power_lifting_results.json
            research/checkpoints/2026_09_07_adversarial_audit/fourth_round/verification/results.json
