name: Lean distinguished-procession product

on:
  push:
    branches:
      - "research/actual-full-procession-product-region-v1"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  distinguished-procession:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Resolve pinned dependencies and restore Mathlib cache
        working-directory: Lean
        shell: bash
        run: |
          lake update
          lake exe cache get

      - name: Build the project root and reachable dependencies
        working-directory: Lean
        shell: bash
        run: |
          lake build

      - name: Compile the theorem module
        working-directory: Lean
        shell: bash
        run: |
          lake env lean IUTThreeClosures/ActualDistinguishedProcessionProductRegion.lean

      - name: Compile and print the axiom dependency ledger
        working-directory: Lean
        shell: bash
        run: |
          lake env lean IUTThreeClosures/ActualDistinguishedProcessionProductRegionAxiomAudit.lean
