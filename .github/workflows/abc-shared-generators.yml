name: Shared generators and independent branches scoped verification

on:
  push:
    branches: [main]
    paths:
      - 'research/checkpoints/2026_09_07_*/**'
      - 'research/checkpoints/2026_09_05_eisenstein_descent/Lean/**'
      - 'research/checkpoints/2026_09_05_power_descent/Lean/**'
      - 'research/checkpoints/2026_09_06_exponent_profiles/Lean/**'
      - '.github/workflows/abc-shared-generators.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-proof-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install the repository-pinned compiler
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: 'false'
          build: 'false'
          use-mathlib-cache: 'false'
      - name: Fresh scoped Lake build and complete axiom inventory
        run: python3 research/checkpoints/2026_09_07_overlap_formal/verify_round.py
      - name: Exact finite replays
        run: |
          python3 research/checkpoints/2026_09_07_critical_bottleneck/replay.py
          python3 research/checkpoints/2026_09_07_adversarial_audit/verify.py
          git diff --exit-code -- research/checkpoints/2026_09_07_critical_bottleneck/verification/exact_results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shared-generators-scoped-proof-evidence
          path: |
            research/checkpoints/2026_09_07_overlap_formal/verification/
            research/checkpoints/2026_09_07_critical_bottleneck/verification/
            research/checkpoints/2026_09_07_adversarial_audit/verification/
