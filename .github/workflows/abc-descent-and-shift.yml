name: Descent inputs and finite F13 verification

on:
  push:
    branches: [main]
    paths:
      - 'research/checkpoints/2026_09_08_descent_and_shift/**'
      - 'research/checkpoints/2026_09_07_independent_route/nineteenth_round/**'
      - 'research/checkpoints/2026_09_07_adversarial_audit/nineteenth_round/**'
      - 'research/checkpoints/2026_09_07_critical_bottleneck/eighteenth_round/next_replay_shifted_pairs.py'
      - 'research/checkpoints/2026_09_07_critical_bottleneck/eighteenth_round/next_shifted_pairs_exact.json'
      - '.github/workflows/abc-descent-and-shift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-inputs-and-f13:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Invalidate historical evidence
        run: python3 research/checkpoints/2026_09_08_descent_and_shift/initialize_ci_evidence.py
      - name: Replay two exact finite certificates
        run: python3 research/checkpoints/2026_09_08_descent_and_shift/verify_finite.py
      - name: Install the pinned compiler
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: 'false'
          build: 'false'
          use-mathlib-cache: 'false'
      - name: Prepare the Mathlib-only project
        run: python3 research/checkpoints/2026_09_08_descent_and_shift/prepare_mathlib_project.py
      - name: Resolve the exact Mathlib revision and cached imports
        working-directory: tmp/abc_20260908/descent-shift-ci-project
        run: |
          lake update
          lake exe cache get Mathlib.Algebra.Polynomial.Derivative Mathlib.Algebra.Field.ZMod Mathlib.Data.Fintype.Prod Mathlib.Data.Fintype.Sum Mathlib.Tactic
      - name: Fresh kernel compilation and all 15 axiom queries
        run: python3 research/checkpoints/2026_09_08_descent_and_shift/verify_mathlib.py --project tmp/abc_20260908/descent-shift-ci-project
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: descent-inputs-and-f13-evidence
          path: |
            research/checkpoints/2026_09_08_descent_and_shift/verification/mathlib_validation.json
            research/checkpoints/2026_09_08_descent_and_shift/verification/fresh-mathlib-build.log
            research/checkpoints/2026_09_08_descent_and_shift/verification/finite_replay_validation.json
