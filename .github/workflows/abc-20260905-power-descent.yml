name: Power descent and infinite valuation certificate
on:
  push:
    branches: ["verify/**", "main"]
    paths:
      - "research/checkpoints/2026_09_05_power_descent/**"
      - ".github/workflows/abc-20260905-power-descent.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify source hashes and exact finite replay
        shell: bash
        run: |
          set -euo pipefail
          python3 research/checkpoints/2026_09_05_power_descent/verify.py
      - name: Compile scoped universal proofs and audit actual axioms
        shell: bash
        run: |
          set -euo pipefail
          bash research/checkpoints/2026_09_05_power_descent/wsl/verify_lean.sh
