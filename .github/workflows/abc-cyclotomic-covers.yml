name: Cyclotomic and cover arithmetic scoped verification

on:
  push:
    branches: [main]
    paths:
      - 'research/checkpoints/2026_09_07_cyclotomic_covers/**'
      - 'research/checkpoints/2026_09_07_adversarial_audit/fifth_round/**'
      - 'research/checkpoints/2026_09_07_critical_bottleneck/fifth_round/**'
      - 'research/checkpoints/2026_09_07_independent_route/fifth_round/**'
      - 'research/checkpoints/2026_09_05_eisenstein_descent/Lean/EisensteinDescent.lean'
      - 'research/checkpoints/2026_09_07_support_power_classes/Lean/LocalPowerArithmetic.lean'
      - 'Lean/lean-toolchain'
      - '.github/workflows/abc-cyclotomic-covers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lucas-and-quartic-arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install the repository-pinned compiler
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: 'false'
          build: 'false'
          use-mathlib-cache: 'false'
      - name: Fresh scoped Lean build and complete theorem axiom audit
        run: python3 research/checkpoints/2026_09_07_cyclotomic_covers/verify_round.py
      - name: Independently replay cyclotomic packets, bad-prime support and actual high ranks
        run: |
          python3 research/checkpoints/2026_09_07_critical_bottleneck/fifth_round/replay.py --check
          python3 research/checkpoints/2026_09_07_independent_route/fifth_round/exact_cover_arithmetic.py
          python3 research/checkpoints/2026_09_07_adversarial_audit/fifth_round/replay_high_rank.py
          git diff --exit-code -- research/checkpoints/2026_09_07_independent_route/fifth_round/exact_cover_arithmetic_results.json research/checkpoints/2026_09_07_adversarial_audit/fifth_round/verification/high_rank_results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cyclotomic-cover-proof-evidence
          path: |
            research/checkpoints/2026_09_07_cyclotomic_covers/verification/
            research/checkpoints/2026_09_07_critical_bottleneck/fifth_round/finite_replay.json
            research/checkpoints/2026_09_07_independent_route/fifth_round/exact_cover_arithmetic_results.json
            research/checkpoints/2026_09_07_adversarial_audit/fifth_round/verification/high_rank_results.json
