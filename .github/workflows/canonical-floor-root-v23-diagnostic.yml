name: Canonical floor-root v23 diagnostic

on:
  push:
    branches:
      - "formalize/canonical-floor-root-budget-v23"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Restore pinned Mathlib cache
        working-directory: Lean
        shell: bash
        run: |
          lake update >/dev/null 2>&1
          lake exe cache get >/dev/null 2>&1

      - name: Compile canonical floor-root module
        working-directory: Lean
        shell: bash
        run: |
          set +e
          lake build IUTThreeClosures.CanonicalFloorRootRadicalBudget > ../canonical-floor-root-v23.log 2>&1
          rc=$?
          cat ../canonical-floor-root-v23.log
          exit "$rc"
