name: Apply PR350 source repair

# This workflow is temporary and will be deleted after it writes the repair.
on:
  push:
    branches:
      - formalize/actual-procession-product-union-v14

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply exact finite-sum repair and persistent root import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          theorem_path = Path('Lean/IUTThreeClosures/ActualBadPlaceProcessionGeometry.lean')
          text = theorem_path.read_text(encoding='utf-8')
          old = '''    _ = ∑ m ∈ Finset.range (processionLength D),
          (distinguishedLabelProductRegion Q m).logVolume := by
      simpa using Fin.sum_univ_eq_sum_range
        (fun m => (distinguishedLabelProductRegion Q m).logVolume)
        (processionLength D)
'''
          new = '''    _ = ∑ m ∈ Finset.range (processionLength D),
          (distinguishedLabelProductRegion Q m).logVolume := by
      exact (Finset.sum_range
        (fun m => (distinguishedLabelProductRegion Q m).logVolume)).symm
'''
          if old not in text:
              raise SystemExit('Expected PR350 finite-sum block was not found; refusing an unsafe rewrite')
          theorem_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          root_path = Path('Lean/IUTThreeClosures.lean')
          root = root_path.read_text(encoding='utf-8')
          import_line = 'import IUTThreeClosures.ActualBadPlaceProcessionGeometry'
          if import_line not in root:
              if not root.endswith('\n'):
                  root += '\n'
              root += '\n-- Full actual procession product and same-ambient union audit.\n'
              root += import_line + '\n'
              root_path.write_text(root, encoding='utf-8')
          PY

      - name: Commit repair to the PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Lean/IUTThreeClosures/ActualBadPlaceProcessionGeometry.lean Lean/IUTThreeClosures.lean
          git diff --cached --check
          git commit -m 'Fix procession finite-sum elaboration and root coverage'
          git push origin HEAD:formalize/actual-procession-product-union-v14
