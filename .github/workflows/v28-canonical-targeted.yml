name: v28 canonical powerful residual targeted diagnostic

on:
  push:
    branches:
      - "diagnostic/v28-canonical-powerful-residual"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Resolve dependencies
        working-directory: Lean
        shell: bash
        run: |
          lake update >/dev/null 2>&1
          lake exe cache get >/dev/null 2>&1

      - name: Compile v28 module
        working-directory: Lean
        shell: bash
        run: |
          set +e
          lake build IUTThreeClosures.CanonicalPowerfulResidualCore \
            > ../v28-targeted.log 2>&1
          rc=$?
          cat ../v28-targeted.log
          exit "$rc"
