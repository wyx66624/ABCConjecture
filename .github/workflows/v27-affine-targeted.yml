name: v27 affine residual targeted diagnostic 2

on:
  push:
    branches:
      - "diagnostic/v27-affine-residual-2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Resolve pinned dependencies and restore Mathlib cache
        working-directory: Lean
        shell: bash
        run: |
          lake update >/dev/null 2>&1
          lake exe cache get >/dev/null 2>&1

      - name: Compile v27 modules
        working-directory: Lean
        shell: bash
        run: |
          set +e
          lake build \
            IUTThreeClosures.AffineResidualParametrization \
            IUTThreeClosures.AffinePrimitiveEndpointFamily \
            IUTThreeClosures.AffineResidualDiscriminant \
            IUTThreeClosures.AffineResidualTrivialSlice \
            > ../v27-targeted.log 2>&1
          rc=$?
          cat ../v27-targeted.log
          exit "$rc"
