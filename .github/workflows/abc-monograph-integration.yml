name: ABC monograph integration and audit
on:
  push:
    branches: ['verify/monograph-20260905*']
    paths: ['.github/workflows/abc-monograph-integration.yml', 'research/checkpoints/2026_09_05_rank_law/**', 'paper/supplements/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install checksum-pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.32.2/lean-4.32.2-linux.tar.zst
          echo '5f2069e6f5db73780f374ccb49ce8ea649aa20a0cebf0116816744c999ce72aa  /tmp/lean.tar.zst' | sha256sum -c -
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          echo '/tmp/lean-4.32.2-linux/bin' >> "$GITHUB_PATH"
      - name: Check new multiplicity and modular certificates
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          D=research/checkpoints/2026_09_05_rank_law
          lean -DwarningAsError=true "$D/Lean/RankDepth.lean" | tee /tmp/rank-axioms.log
          python3 research/checkpoints/2026_09_05_transverse_lifting/wsl/check_axioms.py "$D/Lean/RankDepth.lean" /tmp/rank-axioms.log
