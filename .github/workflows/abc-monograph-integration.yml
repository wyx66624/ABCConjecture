name: ABC monograph integration and audit
on:
  push:
    branches: ['verify/monograph-20260905*']
    paths: ['.github/workflows/abc-monograph-integration.yml', 'research/checkpoints/2026_09_05_rank_law/**', 'paper/supplements/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Inspect exact manuscript and source inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pypdf
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib
          from pypdf import PdfReader
          p=Path('paper/ChatGPT_ABC_Uniformity_2026.tex'); s=p.read_text()
          pdf=Path('output/pdf/ChatGPT_ABC_Uniformity_2026.pdf')
          out={'commit':'${{ github.sha }}','master_bytes':p.stat().st_size,'master_lines':len(s.splitlines()),'master_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'pdf_exists':pdf.is_file(),'pdf_pages':len(PdfReader(pdf).pages) if pdf.is_file() else None,'inputs':re.findall(r'\\(?:input|include)\{([^}]+)\}',s),'headings':re.findall(r'\\(?:section|subsection)\*?\{([^}]+)\}',s),'checkpoint_papers':[str(q) for q in Path('research/checkpoints').rglob('*.tex')]}
          print(json.dumps(out,indent=2))
          PY
