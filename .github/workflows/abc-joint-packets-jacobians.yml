name: Joint packets and quotient Jacobians verification

on:
  push:
    branches: [main]
    paths:
      - 'research/checkpoints/2026_09_07_joint_packets_and_jacobians/**'
      - 'research/checkpoints/2026_09_07_critical_bottleneck/sixteenth_round/**'
      - 'research/checkpoints/2026_09_07_adversarial_audit/sixteenth_round/**'
      - 'research/checkpoints/2026_09_07_independent_route/sixteenth_round/**'
      - 'research/checkpoints/2026_09_07_signed_moment_descent/Lean/ActualGramRigidity.lean'
      - 'research/checkpoints/2026_09_07_signed_moment_descent/Lean/ActualSignedProducts.lean'
      - 'research/checkpoints/2026_09_05_eisenstein_descent/Lean/EisensteinDescent.lean'
      - 'Lean/lean-toolchain'
      - '.github/workflows/abc-joint-packets-jacobians.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joint-packets-and-finite-curves:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Invalidate historical verification outputs before dependency work
        run: python3 research/checkpoints/2026_09_07_joint_packets_and_jacobians/initialize_ci_evidence.py
      - name: Verify stale evidence is rejected on failed preflights
        run: python3 research/checkpoints/2026_09_07_joint_packets_and_jacobians/verify_ci_failure_paths.py
      - name: Install the pinned compiler
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: 'false'
          build: 'false'
          use-mathlib-cache: 'false'
      - name: Prepare a Mathlib-only dependency project
        run: python3 research/checkpoints/2026_09_07_joint_packets_and_jacobians/prepare_mathlib_project.py
      - name: Resolve exact Mathlib and restore required imports
        working-directory: tmp/abc_20260907/joint-packets-jacobians-ci-project
        run: |
          lake update
          lake exe cache get Mathlib.Tactic Mathlib.RingTheory.Coprime.Lemmas Mathlib.Data.Fintype.BigOperators Mathlib.Data.ZMod.Basic Mathlib.Data.Fintype.Prod Mathlib.Algebra.Group.TypeTags.Basic
      - name: Fresh 27 new and 45 dependency declarations with complete axiom audit
        run: python3 research/checkpoints/2026_09_07_joint_packets_and_jacobians/verify_mathlib.py --project tmp/abc_20260907/joint-packets-jacobians-ci-project
      - name: Exact finite curve and quadratic-field replay
        run: python3 research/checkpoints/2026_09_07_joint_packets_and_jacobians/verify_finite.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: joint-packets-and-quotient-evidence
          path: |
            research/checkpoints/2026_09_07_joint_packets_and_jacobians/verification/mathlib_validation.json
            research/checkpoints/2026_09_07_joint_packets_and_jacobians/verification/fresh-mathlib-build.log
            research/checkpoints/2026_09_07_joint_packets_and_jacobians/verification/finite_replay_validation.json
