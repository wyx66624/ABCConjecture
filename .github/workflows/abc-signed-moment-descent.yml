name: Signed moments and quadratic descent verification

on:
  push:
    branches: [main]
    paths:
      - 'research/checkpoints/2026_09_07_signed_moment_descent/**'
      - 'research/checkpoints/2026_09_07_critical_bottleneck/fifteenth_round/**'
      - 'research/checkpoints/2026_09_07_adversarial_audit/fifteenth_round/**'
      - 'research/checkpoints/2026_09_07_independent_route/fifteenth_round/**'
      - 'research/checkpoints/2026_09_07_critical_bottleneck/thirteenth_round/Lean/UniformMomentArithmetic.lean'
      - 'research/checkpoints/2026_09_07_critical_bottleneck/fourteenth_round/Lean/AdaptiveOwnerArithmetic.lean'
      - 'research/checkpoints/2026_09_05_eisenstein_descent/Lean/EisensteinDescent.lean'
      - 'Lean/lean-toolchain'
      - '.github/workflows/abc-signed-moment-descent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-signed-products-and-descent:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install the pinned compiler
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: 'false'
          build: 'false'
          use-mathlib-cache: 'false'
      - name: Prepare a Mathlib-only dependency project
        run: python3 research/checkpoints/2026_09_07_signed_moment_descent/prepare_mathlib_project.py
      - name: Resolve exact Mathlib and restore required imports
        working-directory: tmp/abc_20260907/signed-moment-descent-ci-project
        run: |
          lake update
          lake exe cache get Mathlib.Tactic Mathlib.Data.Finset.Max Mathlib.Algebra.Order.Floor.Ring Mathlib.Analysis.SpecialFunctions.Log.Basic Mathlib.Algebra.BigOperators.Group.Finset.Piecewise Mathlib.Algebra.Group.TypeTags.Basic Mathlib.Data.Int.GCD
      - name: Fresh 55 new and 56 dependency declarations with complete axiom audit
        run: python3 research/checkpoints/2026_09_07_signed_moment_descent/verify_mathlib.py --project tmp/abc_20260907/signed-moment-descent-ci-project
      - name: Exact quadratic descent and mod-27 replay
        run: python3 research/checkpoints/2026_09_07_signed_moment_descent/verify_finite.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: signed-moment-and-descent-evidence
          path: |
            research/checkpoints/2026_09_07_signed_moment_descent/verification/mathlib_validation.json
            research/checkpoints/2026_09_07_signed_moment_descent/verification/fresh-mathlib-build.log
            research/checkpoints/2026_09_07_signed_moment_descent/verification/finite_replay_validation.json
