name: Merge green GenEll endpoint theorem

on:
  workflow_run:
    workflows: ["Lean kernel build"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-target:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.workflow_run.head_sha;
            const expectedBranch = 'research/genell-integer-endpoints-pnt-window';
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: sha,
            });
            for (const pr of prs) {
              if (pr.state !== 'open' || pr.base.ref !== 'main') continue;
              if (pr.head.repo.full_name !== `${owner}/${repo}`) continue;
              if (pr.head.ref !== expectedBranch || pr.head.sha !== sha) continue;
              await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number, sha,
                merge_method: 'merge',
                commit_title: `${pr.title} (#${pr.number})`,
                commit_message: 'Automatically merged after the exact PR head passed the Lean 4.32 kernel build.',
              });
            }
