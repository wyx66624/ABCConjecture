name: Actual integral lifting and global radical verification

on:
  push:
    branches: [main]
    paths:
      - 'research/checkpoints/2026_09_07_integral_lifting/**'
      - 'research/checkpoints/2026_09_07_critical_bottleneck/eleventh_round/**'
      - 'research/checkpoints/2026_09_07_adversarial_audit/eleventh_round/**'
      - 'research/checkpoints/2026_09_07_independent_route/eleventh_round/**'
      - 'research/checkpoints/2026_09_07_depth_compensation/Lean/**'
      - 'research/checkpoints/2026_09_05_eisenstein_descent/Lean/EisensteinDescent.lean'
      - 'Lean/lean-toolchain'
      - '.github/workflows/abc-integral-lifting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-content-and-global-radical:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install the pinned compiler
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: 'false'
          build: 'false'
          use-mathlib-cache: 'false'
      - name: Prepare a Mathlib-only dependency project
        run: python3 research/checkpoints/2026_09_07_integral_lifting/prepare_mathlib_project.py
      - name: Resolve exact Mathlib and restore required imports
        working-directory: tmp/abc_20260907/integral-lifting-ci-project
        run: |
          lake update
          lake exe cache get Mathlib.Analysis.SpecialFunctions.Log.Basic Mathlib.Data.Nat.Factorization.Basic Mathlib.Data.Nat.GCD.BigOperators Mathlib.Data.Int.GCD Mathlib.Tactic.Linarith Mathlib.Tactic.NormNum Mathlib.Tactic.Positivity Mathlib.Tactic.Ring Mathlib.Tactic.FieldSimp
      - name: Fresh 31 new declarations and 53 dependency declarations with complete axiom audit
        run: python3 research/checkpoints/2026_09_07_integral_lifting/verify_mathlib.py --project tmp/abc_20260907/integral-lifting-ci-project
      - name: Exact content identities and the finite norm-seven family
        run: python3 research/checkpoints/2026_09_07_integral_lifting/verify_finite.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actual-integral-lifting-evidence
          path: |
            research/checkpoints/2026_09_07_integral_lifting/verification/mathlib_validation.json
            research/checkpoints/2026_09_07_integral_lifting/verification/fresh-mathlib-build.log
            research/checkpoints/2026_09_07_integral_lifting/verification/finite_replay_validation.json
