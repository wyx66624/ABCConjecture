name: Verify and merge same-epsilon split descent v41

on:
  push:
    branches:
      - "automation/verify-merge-same-epsilon-split-v41"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          data="$(gh api "repos/${REPO}/pulls?state=open&head=wyx66624:formalize/same-epsilon-split-descent-v41")"
          number="$(jq -r '.[0].number // empty' <<<"$data")"
          sha="$(jq -r '.[0].head.sha // empty' <<<"$data")"
          test -n "$number"
          test -n "$sha"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable candidate SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 1

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Resolve dependencies
        working-directory: Lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Reject unfinished declarations
        shell: bash
        run: |
          set -euo pipefail
          file="Lean/IUTThreeClosures/ActualSplitSquareSameEpsilonDescent.lean"
          test -f "$file"
          if grep -nE '(^|[^[:alnum:]_])(axiom|sorry|admit)([^[:alnum:]_]|$)' "$file"; then
            echo "Forbidden unfinished declaration found" >&2
            exit 1
          fi

      - name: Full Lean kernel build
        working-directory: Lean
        shell: bash
        run: |
          set -euo pipefail
          lake build
          lake build IUTThreeClosures.ActualSplitSquareSameEpsilonDescent

      - name: Verify head and merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          VERIFIED_SHA: ${{ steps.pr.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "$current_sha" = "$VERIFIED_SHA"
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --merge \
            --match-head-commit "$VERIFIED_SHA" \
            --subject "Merge same-epsilon split-square descent" \
            --body "Merge the no-loss descent and minimal-counterexample forcing after an immutable-head full Lean build."
