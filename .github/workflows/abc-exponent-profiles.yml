name: ABC exponent profiles scoped verification
on:
  push:
    branches: ['verify/exponent-profiles-20260906*']
    paths: ['research/checkpoints/2026_09_06_exponent_profiles/**', '.github/workflows/abc-exponent-profiles.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install isolated checksum-pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.32.2/lean-4.32.2-linux.tar.zst
          echo '5f2069e6f5db73780f374ccb49ce8ea649aa20a0cebf0116816744c999ce72aa  /tmp/lean.tar.zst' | sha256sum -c -
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          echo '/tmp/lean-4.32.2-linux/bin' >> "$GITHUB_PATH"
      - name: Compile actual regrouping and progression statements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/abc-profile-olean verification-profiles
          lean --version | tee verification-profiles/compiler.txt
          E=research/checkpoints/2026_09_05_eisenstein_descent/Lean/EisensteinDescent.lean
          P=research/checkpoints/2026_09_06_exponent_profiles/Lean/ExponentProfiles.lean
          C=research/checkpoints/2026_09_05_transverse_lifting/wsl/check_axioms.py
          lean -DwarningAsError=true -o /tmp/abc-profile-olean/EisensteinDescent.olean "$E" | tee verification-profiles/dependency.log
          python3 "$C" "$E" verification-profiles/dependency.log
          LEAN_PATH=/tmp/abc-profile-olean lean -DwarningAsError=true "$P" | tee verification-profiles/profiles.log
          python3 "$C" "$P" verification-profiles/profiles.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exponent-profile-kernel-review
          path: verification-profiles/
          retention-days: 7
