name: ABC height visibility scoped audit
on:
  push:
    branches: ['verify/height-visibility-20260906*']
    paths:
      - 'research/checkpoints/2026_09_06_height_visibility/**'
      - '.github/workflows/abc-height-visibility-20260906.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install isolated checksum-pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.32.2/lean-4.32.2-linux.tar.zst
          echo '5f2069e6f5db73780f374ccb49ce8ea649aa20a0cebf0116816744c999ce72aa  /tmp/lean.tar.zst' | sha256sum -c -
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          echo '/tmp/lean-4.32.2-linux/bin' >> "$GITHUB_PATH"
      - name: Compile scoped identities and audit all printed axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-height
          D=research/checkpoints/2026_09_06_height_visibility
          lean --version | tee verification-height/compiler.txt
          sha256sum "$D/Lean/HeightVisibility.lean" "$D/Lean/HomogeneousTorsion.lean" | tee verification-height/source.sha256
          for name in HeightVisibility HomogeneousTorsion; do
            lean -DwarningAsError=true "$D/Lean/$name.lean" | tee "verification-height/$name.log"
            python3 research/checkpoints/2026_09_05_transverse_lifting/wsl/check_axioms.py "$D/Lean/$name.lean" "verification-height/$name.log" | tee "verification-height/$name-audit.txt"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: height-visibility-scoped-review
          retention-days: 7
          path: verification-height/
