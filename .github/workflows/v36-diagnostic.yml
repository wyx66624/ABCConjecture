name: Lean v36 diagnostic

on:
  push:
    branches:
      - "formalize/three-endpoint-kth-root-v34"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Resolve pinned dependencies and restore Mathlib cache
        working-directory: Lean
        shell: bash
        run: |
          lake update >/dev/null 2>&1
          lake exe cache get >/dev/null 2>&1

      - name: Compile v34-v36 targets and preserve diagnostics
        working-directory: Lean
        shell: bash
        run: |
          set +e
          lake build \
            IUTThreeClosures.ThreeEndpointKthRootThreshold \
            IUTThreeClosures.AggregateThreeEndpointKthRootThreshold \
            IUTThreeClosures.AdaptiveHyperbolicSignature \
            > ../v36-diagnostic.log 2>&1
          echo "$?" > ../v36-diagnostic.exit
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: v36-lean-diagnostic
          path: |
            v36-diagnostic.log
            v36-diagnostic.exit
          if-no-files-found: error
