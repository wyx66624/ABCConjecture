name: Signed compatibility scoped verification

on:
  push:
    branches: [main]
    paths:
      - 'research/checkpoints/2026_09_07_signed_compatibility/**'
      - 'research/checkpoints/2026_09_07_adversarial_audit/ninth_round/**'
      - 'research/checkpoints/2026_09_07_critical_bottleneck/ninth_round/**'
      - 'research/checkpoints/2026_09_07_independent_route/ninth_round/**'
      - 'research/checkpoints/2026_09_05_eisenstein_descent/Lean/EisensteinDescent.lean'
      - 'research/checkpoints/2026_09_07_support_power_classes/Lean/LocalPowerArithmetic.lean'
      - 'research/checkpoints/2026_09_07_cyclotomic_covers/Lean/GeneralLucasBoundary.lean'
      - 'Lean/lean-toolchain'
      - '.github/workflows/abc-signed-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-arms-and-common-exponents:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install the repository-pinned compiler
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: 'false'
          build: 'false'
          use-mathlib-cache: 'false'
      - name: Fresh scoped Lean build and complete theorem axiom inventory
        run: python3 research/checkpoints/2026_09_07_signed_compatibility/verify_round.py
      - name: Exact finite arithmetic and full exceptional valuations
        run: python3 research/checkpoints/2026_09_07_signed_compatibility/verify_finite.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: signed-compatibility-proof-evidence
          path: research/checkpoints/2026_09_07_signed_compatibility/verification/
