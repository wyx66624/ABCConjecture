name: Endpoint residue obstruction audit

on:
  push:
    branches:
      - main
      - "formalize/**"
    paths:
      - "Lean/IUTThreeClosures/EndpointConstantResidueObstruction.lean"
      - "Lean/IUTThreeClosures/EndpointResidueArithmeticFamily.lean"
      - "research/computation/endpoint_residue_obstruction_2026_09_05.py"
      - ".github/workflows/endpoint-residue-obstruction.yml"
  pull_request:
    paths:
      - "Lean/IUTThreeClosures/EndpointConstantResidueObstruction.lean"
      - "Lean/IUTThreeClosures/EndpointResidueArithmeticFamily.lean"
      - "research/computation/endpoint_residue_obstruction_2026_09_05.py"
      - ".github/workflows/endpoint-residue-obstruction.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Exact finite replay
        run: |
          mkdir -p endpoint-audit
          python research/computation/endpoint_residue_obstruction_2026_09_05.py --max-e 6 --output endpoint-audit/cases.json
          echo 'ea56c8bc568e90311204e69e479534c9a7dafa2214db2c3c060831434fee9621  endpoint-audit/cases.json' | sha256sum -c -
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"
      - name: Restore dependencies
        working-directory: Lean
        run: |
          lake update
          lake exe cache get
      - name: Strict kernel checks and axiom whitelist
        working-directory: Lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true IUTThreeClosures/EndpointConstantResidueObstruction.lean 2>&1 | tee ../endpoint-audit/lean-axioms.log
          lake env lean -DwarningAsError=true IUTThreeClosures/EndpointResidueArithmeticFamily.lean 2>&1 | tee -a ../endpoint-audit/lean-axioms.log
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('../endpoint-audit/lean-axioms.log').read_text()
          reports = re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]", text)
          empty = re.findall(r"'([^']+)' does not depend on any axioms", text)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          names = [name for name, _ in reports] + empty
          assert len(names) == len(set(names)) == 13, names
          for name, body in reports:
              axioms = {a.strip() for a in body.split(',') if a.strip()}
              assert axioms <= allowed, (name, axioms - allowed)
          assert 'sorryAx' not in text and 'ofReduceBool' not in text
          print('PASS: 13 distinct declarations; only the three permitted standard axioms')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endpoint-residue-audit
          path: endpoint-audit/
