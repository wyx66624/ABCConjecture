name: Fixed curve inputs and nonlinear selector verification

on:
  push:
    branches: [main]
    paths:
      - 'research/checkpoints/2026_09_08_fixed_curve_closure/**'
      - 'research/checkpoints/2026_09_07_collective_content_closure/next_*'
      - 'research/checkpoints/2026_09_07_collective_content_closure/next_verification/**'
      - 'research/checkpoints/2026_09_07_independent_route/eighteenth_round/**'
      - 'research/checkpoints/2026_09_07_adversarial_audit/eighteenth_round/**'
      - 'research/checkpoints/2026_09_07_critical_bottleneck/eighteenth_round/**'
      - '.github/workflows/abc-fixed-curve-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-inputs-and-selectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Invalidate historical evidence
        run: python3 research/checkpoints/2026_09_08_fixed_curve_closure/initialize_ci_evidence.py
      - name: Replay eight exact finite certificates
        run: python3 research/checkpoints/2026_09_08_fixed_curve_closure/verify_finite.py
      - name: Install the pinned compiler
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: 'false'
          build: 'false'
          use-mathlib-cache: 'false'
      - name: Prepare the Mathlib-only project
        run: python3 research/checkpoints/2026_09_08_fixed_curve_closure/prepare_mathlib_project.py
      - name: Resolve the exact Mathlib revision and cached imports
        working-directory: tmp/abc_20260908/fixed-curve-closure-ci-project
        run: |
          lake update
          lake exe cache get Mathlib.Tactic Mathlib.RingTheory.Coprime.Lemmas Mathlib.Data.ZMod.Basic
      - name: Fresh kernel compilation and all 24 axiom queries
        run: python3 research/checkpoints/2026_09_08_fixed_curve_closure/verify_mathlib.py --project tmp/abc_20260908/fixed-curve-closure-ci-project
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fixed-curve-inputs-and-selector-evidence
          path: |
            research/checkpoints/2026_09_08_fixed_curve_closure/verification/mathlib_validation.json
            research/checkpoints/2026_09_08_fixed_curve_closure/verification/fresh-mathlib-build.log
            research/checkpoints/2026_09_08_fixed_curve_closure/verification/finite_replay_validation.json
