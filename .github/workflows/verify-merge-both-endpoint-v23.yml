name: Verify and merge both-endpoint multiplicity v23

on:
  push:
    branches:
      - "automation/verify-merge-both-endpoint-v23"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_BRANCH: formalize/both-endpoint-multiplicity-v23b
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Freeze target SHA
        id: freeze
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git status --short

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Restore pinned dependencies
        working-directory: Lean
        shell: bash
        run: |
          lake update
          lake exe cache get

      - name: Reject unfinished declarations in the new modules
        shell: bash
        run: |
          set -euo pipefail
          files=(
            Lean/IUTThreeClosures/BothLargeEndpointMultiplicityExcess.lean
            Lean/IUTThreeClosures/SignedPrimeExponentLayer.lean
            Lean/IUTThreeClosures/SquarePartExponentWeight.lean
            Lean/IUTThreeClosures/HigherPowerPartExponentWeight.lean
          )
          for f in "${files[@]}"; do
            test -f "$f"
            if grep -nE '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|^[[:space:]]*axiom[[:space:]]' "$f"; then
              echo "Unfinished declaration found in $f" >&2
              exit 1
            fi
          done

      - name: Compile target module
        working-directory: Lean
        shell: bash
        run: lake build IUTThreeClosures.BothLargeEndpointMultiplicityExcess

      - name: Full Lean package build
        working-directory: Lean
        shell: bash
        run: lake build

      - name: Verify PR still points to the compiled SHA
        id: pr
        shell: bash
        env:
          VERIFIED_SHA: ${{ steps.freeze.outputs.sha }}
        run: |
          set -euo pipefail
          pr_json=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$TARGET_BRANCH" \
            --base main \
            --state open \
            --json number,headRefOid \
            --limit 1)
          pr_number=$(jq -r '.[0].number // empty' <<<"$pr_json")
          pr_sha=$(jq -r '.[0].headRefOid // empty' <<<"$pr_json")
          test -n "$pr_number"
          test "$pr_sha" = "$VERIFIED_SHA"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Merge only the verified head
        shell: bash
        env:
          VERIFIED_SHA: ${{ steps.freeze.outputs.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          response=$(gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=merge \
            -f sha="$VERIFIED_SHA" \
            -f commit_title='Merge simultaneous large-endpoint multiplicity theorem' \
            -f commit_message='Merge the exact-head kernel-built theorem that every abc violation forces height-scale multiplicity excess on both large adjacent endpoints.')
          jq -e '.merged == true' <<<"$response"
