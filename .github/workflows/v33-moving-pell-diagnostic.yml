name: V33 moving-Pell diagnostic

on:
  push:
    branches:
      - "formalize/moving-pell-local-residue-v33"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Resolve pinned dependencies and restore Mathlib cache
        working-directory: Lean
        shell: bash
        run: |
          lake update >/dev/null 2>&1
          lake exe cache get >/dev/null 2>&1

      - name: Compile the new moving-Pell modules
        working-directory: Lean
        shell: bash
        run: |
          set +e
          lake build \
            IUTThreeClosures.ABCPointSquarefreePellWitness \
            IUTThreeClosures.MovingPellApproximationIdentity \
            IUTThreeClosures.SquarefreePellCoefficientSupport \
            IUTThreeClosures.MovingPellLocalResidue \
            > ../v33-moving-pell-diagnostic.log 2>&1
          rc=$?
          cat ../v33-moving-pell-diagnostic.log
          exit "$rc"
