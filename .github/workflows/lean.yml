name: Lean kernel build

on:
  push:
    branches:
      - main
      - "formalize/**"
    paths-ignore:
      - Lean/CI_RESULT.md
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        id: setup
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Resolve pinned dependencies and restore Mathlib cache
        id: dependencies
        working-directory: Lean
        shell: bash
        run: |
          set -o pipefail
          lake update 2>&1 | tee ../lean-dependencies.log
          lake exe cache get 2>&1 | tee -a ../lean-dependencies.log

      - name: Run kernel build
        id: kernel_build
        working-directory: Lean
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee ../lean-build.log

      - name: Record auditable result on the verification branch
        if: always() && startsWith(github.ref, 'refs/heads/formalize/')
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          BUILD_OUTCOME: ${{ steps.kernel_build.outcome }}
        run: |
          {
            echo "# Lean CI result"
            echo
            echo "- Tested commit: \`$TESTED_SHA\`"
            echo "- Lean setup: \`$SETUP_OUTCOME\`"
            echo "- Dependency resolution/cache: \`$DEPENDENCIES_OUTCOME\`"
            echo "- \`lake build\`: \`$BUILD_OUTCOME\`"
            echo
            echo "## Error summary"
            echo
            echo '```text'
            for log in lean-dependencies.log lean-build.log; do
              if [[ -f "$log" ]]; then
                echo "===== $log ====="
                grep -nE '(^error:|^✖|^Some required targets|unknown tactic|unsolved goals|failed to synthesize|Invalid field|unexpected token|declaration uses `sorry`)' "$log" | tail -n 700 || true
              fi
            done
            echo '```'
            echo
            echo "## Dependency log tail"
            echo
            echo '```text'
            if [[ -f lean-dependencies.log ]]; then
              tail -n 250 lean-dependencies.log
            else
              echo "No dependency log was produced."
            fi
            echo '```'
            echo
            echo "## Build log tail"
            echo
            echo '```text'
            if [[ -f lean-build.log ]]; then
              tail -n 900 lean-build.log
            else
              echo "No build log was produced."
            fi
            echo '```'
          } > Lean/CI_RESULT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Lean/lake-manifest.json Lean/CI_RESULT.md
          git commit -m "ci: record Lean build for $TESTED_SHA" || true
          git push
