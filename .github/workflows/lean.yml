name: Lean kernel build

on:
  push:
    branches:
      - main
      - "formalize/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Resolve pinned dependencies and restore Mathlib cache
        working-directory: Lean
        shell: bash
        run: |
          lake update >/dev/null 2>&1
          lake exe cache get >/dev/null 2>&1

      - name: Run kernel build
        working-directory: Lean
        shell: bash
        run: |
          set +e
          lake build > ../lean-build.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            grep -E '(^| )error:|✖|unsolved goals|type mismatch|unknown identifier|application type mismatch|typeclass instance problem' ../lean-build.log | tail -n 180 || true
            echo '--- build tail ---'
            tail -n 220 ../lean-build.log
          fi
          exit "$rc"
