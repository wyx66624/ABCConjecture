name: Lean kernel build

on:
  push:
    branches:
      - main
      - "formalize/**"
      - "research/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Resolve pinned dependencies and restore Mathlib cache
        working-directory: Lean
        shell: bash
        run: |
          lake update >/dev/null 2>&1
          lake exe cache get >/dev/null 2>&1

      - name: Compile v13 research theorems
        working-directory: Lean
        shell: bash
        run: |
          lake env lean IUTThreeClosures/ConservativeTransferDefect.lean
          lake env lean IUTThreeClosures/LegendreSelectorDeterminantBudget.lean

      - name: Run v13 axiom ledger
        working-directory: Lean
        shell: bash
        run: |
          lake env lean IUTThreeClosures/ResearchAxiomAudit.lean > ../research-axiom-audit.log 2>&1
          if grep -q 'sorryAx' ../research-axiom-audit.log; then
            echo 'The v13 axiom ledger contains sorryAx.'
            grep -n 'sorryAx' ../research-axiom-audit.log | head -n 100
            exit 1
          fi
          echo 'The v13 axiom ledger completed without sorryAx.'
          tail -n 120 ../research-axiom-audit.log

      - name: Run default kernel build
        working-directory: Lean
        shell: bash
        run: |
          set +e
          lake build > ../lean-build.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            grep -E '(^| )error:|✖|unsolved goals|type mismatch|unknown identifier|application type mismatch|typeclass instance problem' ../lean-build.log | tail -n 180 || true
            echo '--- build tail ---'
            tail -n 220 ../lean-build.log
          fi
          exit "$rc"

      - name: Run repository axiom ledger
        working-directory: Lean
        shell: bash
        run: |
          lake env lean IUTThreeClosures/AxiomAudit.lean > ../axiom-audit.log 2>&1
          if grep -q 'sorryAx' ../axiom-audit.log; then
            echo 'The repository axiom ledger contains sorryAx.'
            grep -n 'sorryAx' ../axiom-audit.log | head -n 100
            exit 1
          fi
          echo 'The repository axiom ledger completed without sorryAx.'
          tail -n 120 ../axiom-audit.log
