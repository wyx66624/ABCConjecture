name: Lean kernel build

on:
  push:
    branches:
      - main
      - "formalize/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "true"
          build-args: "--wfail"
          use-mathlib-cache: "true"
          leanchecker: "true"
