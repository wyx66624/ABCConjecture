name: Lean kernel build

on:
  push:
    branches:
      - main
      - "formalize/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Resolve pinned dependencies and restore Mathlib cache
        working-directory: Lean
        shell: bash
        run: |
          set -o pipefail
          lake update 2>&1 | tee ../lean-dependencies.log
          lake exe cache get 2>&1 | tee -a ../lean-dependencies.log

      - name: Run kernel build
        working-directory: Lean
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee ../lean-build.log
