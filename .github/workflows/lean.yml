name: Lean kernel build

on:
  push:
    branches:
      - main
      - "formalize/**"
      - "research/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Resolve pinned dependencies and restore Mathlib cache
        working-directory: Lean
        shell: bash
        run: |
          lake update >/dev/null 2>&1
          lake exe cache get >/dev/null 2>&1

      - name: Run default kernel build
        working-directory: Lean
        shell: bash
        run: |
          set +e
          lake build > ../lean-build.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            grep -E '(^| )error:|✖|unsolved goals|type mismatch|unknown identifier|application type mismatch|typeclass instance problem' ../lean-build.log | tail -n 180 || true
            echo '--- build tail ---'
            tail -n 220 ../lean-build.log
          fi
          exit "$rc"

      - name: Compile v13 research theorems
        working-directory: Lean
        shell: bash
        run: |
          lake env lean IUTThreeClosures/ConservativeTransferDefect.lean
          lake env lean IUTThreeClosures/LegendreSelectorDeterminantBudget.lean

      - name: Run repository and v13 axiom ledgers
        working-directory: Lean
        shell: bash
        run: |
          set +e
          lake env lean IUTThreeClosures/AxiomAudit.lean > ../axiom-audit.log 2>&1
          rc_main=$?
          lake env lean IUTThreeClosures/ResearchAxiomAudit.lean > ../research-axiom-audit.log 2>&1
          rc_research=$?
          if [ "$rc_main" -ne 0 ]; then
            echo '--- repository axiom audit tail ---'
            tail -n 240 ../axiom-audit.log
            exit "$rc_main"
          fi
          if [ "$rc_research" -ne 0 ]; then
            echo '--- research axiom audit tail ---'
            tail -n 240 ../research-axiom-audit.log
            exit "$rc_research"
          fi
          if grep -q 'sorryAx' ../axiom-audit.log ../research-axiom-audit.log; then
            echo 'An axiom ledger contains sorryAx.'
            grep -n 'sorryAx' ../axiom-audit.log ../research-axiom-audit.log | head -n 100
            exit 1
          fi
          echo 'Both axiom ledgers completed without sorryAx.'
          tail -n 80 ../axiom-audit.log
          tail -n 120 ../research-axiom-audit.log
