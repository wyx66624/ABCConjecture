name: Lean all-module audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  all-modules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: false
          build: false
          use-mathlib-cache: false

      - name: Resolve pinned dependencies and restore Mathlib cache
        working-directory: Lean
        shell: bash
        run: |
          lake update
          lake exe cache get

      - name: Generate an import root for every project module
        working-directory: Lean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('IUTThreeClosures')
          modules = []
          for path in sorted(root.rglob('*.lean')):
              rel = path.with_suffix('')
              modules.append('.'.join(rel.parts))

          audit = Path('AllProjectModules.lean')
          audit.write_text(
              '/- Automatically generated by CI. -/\n'
              + ''.join(f'import {module}\n' for module in modules),
              encoding='utf-8',
          )
          print(f'Generated {audit} with {len(modules)} imports')
          PY

      - name: Kernel-check every project module
        working-directory: Lean
        shell: bash
        run: |
          lake env lean AllProjectModules.lean
