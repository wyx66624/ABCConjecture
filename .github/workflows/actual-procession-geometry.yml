name: Actual procession geometry

on:
  push:
    branches:
      - "formalize/actual-procession-product-union-v14"
  pull_request:
    paths:
      - "Lean/IUTThreeClosures/ActualBadPlaceProcessionGeometry.lean"
      - "Lean/IUTThreeClosures/ActualBadPlaceProcessionGeometryAxiomAudit.lean"
      - "Lean/ACTUAL_BAD_PLACE_PROCESSION_GEOMETRY.md"
      - ".github/workflows/actual-procession-geometry.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  direct-kernel-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"

      - name: Resolve pinned dependencies and restore Mathlib cache
        working-directory: Lean
        shell: bash
        run: |
          lake update >/dev/null 2>&1
          lake exe cache get >/dev/null 2>&1

      - name: Elaborate the theorem module directly
        working-directory: Lean
        shell: bash
        run: lake env lean IUTThreeClosures/ActualBadPlaceProcessionGeometry.lean

      - name: Elaborate the dependency audit directly
        working-directory: Lean
        shell: bash
        run: lake env lean IUTThreeClosures/ActualBadPlaceProcessionGeometryAxiomAudit.lean

      - name: Check the existing default target
        working-directory: Lean
        shell: bash
        run: lake build
