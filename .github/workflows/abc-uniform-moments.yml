name: Uniform moments and cubic local verification

on:
  push:
    branches: [main]
    paths:
      - 'research/checkpoints/2026_09_07_uniform_moments/**'
      - 'research/checkpoints/2026_09_07_critical_bottleneck/thirteenth_round/**'
      - 'research/checkpoints/2026_09_07_adversarial_audit/thirteenth_round/**'
      - 'research/checkpoints/2026_09_07_independent_route/thirteenth_round/**'
      - 'Lean/lean-toolchain'
      - '.github/workflows/abc-uniform-moments.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-moments-and-local-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install the pinned compiler
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: 'false'
          build: 'false'
          use-mathlib-cache: 'false'
      - name: Prepare a Mathlib-only dependency project
        run: python3 research/checkpoints/2026_09_07_uniform_moments/prepare_mathlib_project.py
      - name: Resolve exact Mathlib and restore required imports
        working-directory: tmp/abc_20260907/uniform-moments-ci-project
        run: |
          lake update
          lake exe cache get Mathlib.Tactic Mathlib.Data.Sym.Card Mathlib.Algebra.BigOperators.Group.Finset.Piecewise
      - name: Fresh 37 new declarations with complete axiom audit
        run: python3 research/checkpoints/2026_09_07_uniform_moments/verify_mathlib.py --project tmp/abc_20260907/uniform-moments-ci-project
      - name: Install the bounded-search dependency
        run: sudo apt-get update && sudo apt-get install -y pari-gp
      - name: Exact cubic quotients and local arithmetic replay
        run: python3 research/checkpoints/2026_09_07_uniform_moments/verify_finite.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: uniform-moments-and-local-evidence
          path: |
            research/checkpoints/2026_09_07_uniform_moments/verification/mathlib_validation.json
            research/checkpoints/2026_09_07_uniform_moments/verification/fresh-mathlib-build.log
            research/checkpoints/2026_09_07_uniform_moments/verification/finite_replay_validation.json
