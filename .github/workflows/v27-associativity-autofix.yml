name: v27 associativity autofix

on:
  push:
    branches:
      - "formalize/coprime-residue-product-core-v27"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: formalize/coprime-residue-product-core-v27

      - name: Apply exact Lean associativity repairs
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('Lean/IUTThreeClosures/SquareCubeResidualSixthPower.lean')
          text = path.read_text()

          def sub_once(pattern: str, replacement: str, source: str) -> str:
              result, count = re.subn(pattern, replacement, source, count=1,
                                      flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'expected exactly one regex match, got {count}: {pattern}')
              return result

          text = sub_once(
              r'^(?P<i>[ \t]*)exact weighted_div_two_add_div_three_le_sixth_budget\n[ \t]*\(exponent i\) \(weight i\) \(hweight i hi\)$',
              r'\g<i>simpa [add_assoc] using\n\g<i>  weighted_div_two_add_div_three_le_sixth_budget\n\g<i>    (exponent i) (weight i) (hweight i hi)',
              text)

          text = sub_once(
              r'^(?P<i>[ \t]*)rw \[Finset\.sum_add_distrib, Finset\.sum_add_distrib,\n[ \t]*← Finset\.mul_sum, ← Finset\.mul_sum, ← Finset\.mul_sum\]\n\n(?=/-- Sharp finite-profile ledger)',
              r'\g<i>rw [Finset.sum_add_distrib, Finset.sum_add_distrib,\n\g<i>  ← Finset.mul_sum, ← Finset.mul_sum, ← Finset.mul_sum]\n\g<i>ring\n\n',
              text)

          text = sub_once(
              r'^(?P<i>[ \t]*)exact weighted_signed_surplus_le_sixth_budget\n[ \t]*\(exponent i\) \(weight i\) \(hweight i hi\)$',
              r'\g<i>simpa [add_assoc] using\n\g<i>  weighted_signed_surplus_le_sixth_budget\n\g<i>    (exponent i) (weight i) (hweight i hi)',
              text)

          text = sub_once(
              r'^(?P<i>[ \t]*)rw \[Finset\.sum_add_distrib, Finset\.sum_add_distrib,\n[ \t]*← Finset\.mul_sum, ← Finset\.mul_sum\]\n\n(?=/-- Flexible trichotomy)',
              r'\g<i>rw [Finset.sum_add_distrib, Finset.sum_add_distrib,\n\g<i>  ← Finset.mul_sum, ← Finset.mul_sum]\n\g<i>ring\n\n',
              text)

          path.write_text(text)
          Path('.github/workflows/v27-associativity-autofix.yml').unlink()
          PY

      - name: Commit repaired module and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Lean/IUTThreeClosures/SquareCubeResidualSixthPower.lean \
            .github/workflows/v27-associativity-autofix.yml
          git commit -m "Repair sharp square-cube summation associativity"
          git push origin HEAD:formalize/coprime-residue-product-core-v27
