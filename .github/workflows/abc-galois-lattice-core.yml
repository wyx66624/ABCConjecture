name: ABC Galois lattice integer core
on:
  push:
    branches: ['verify/galois-lattice-20260906*']
    paths:
      - 'research/checkpoints/2026_09_06_galois_lattices/Lean/**'
      - '.github/workflows/abc-galois-lattice-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install checksum-pinned isolated Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.32.2/lean-4.32.2-linux.tar.zst
          echo '5f2069e6f5db73780f374ccb49ce8ea649aa20a0cebf0116816744c999ce72aa  /tmp/lean.tar.zst' | sha256sum -c -
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          echo '/tmp/lean-4.32.2-linux/bin' >> "$GITHUB_PATH"
      - name: Compile integer cores and audit printed axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-galois-core
          D=research/checkpoints/2026_09_06_galois_lattices/Lean/GaloisLatticeCore.lean
          lean --version | tee verification-galois-core/compiler.txt
          sha256sum "$D" | tee verification-galois-core/source.sha256
          lean -DwarningAsError=true -o /tmp/GaloisLatticeCore.olean "$D" | tee verification-galois-core/axioms.log
          python3 research/checkpoints/2026_09_05_transverse_lifting/wsl/check_axioms.py "$D" verification-galois-core/axioms.log | tee verification-galois-core/audit.txt
          echo 'PASS: finite integer coefficient cores only; no Jacobian, field-discriminant or ABC formalization.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: galois-lattice-core-review
          retention-days: 7
          path: |
            verification-galois-core/
            research/checkpoints/2026_09_06_galois_lattices/Lean/GaloisLatticeCore.lean
