name = "IUTABCComprehensiveResearch"
version = "0.4.0"
defaultTargets = ["IUTThreeClosures"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "iut"
git = "https://github.com/lana-agents/iut.git"
rev = "ddaddc274281adb5674d647e24fa478745ac6d40"

[[require]]
name = "genl"
git = "https://github.com/LANA-Project/genl.git"
rev = "6e9a6543b46a2a02fd7fe7ec8ab203d878f32859"

[[require]]
name = "heights"
git = "https://github.com/lana-agents/heights.git"
rev = "3539e2a12dd3470c057a4eb531dc3fd627d4c97b"

[[lean_lib]]
name = "IUTThreeClosures"
globs = ["IUTThreeClosures.*"]
